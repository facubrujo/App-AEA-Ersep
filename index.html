<!-- ===================================================== -->
<!-- EDITOR ELECTRICO AEA / ERSEP                         -->
<!-- FASE 1: ESTRUCTURA BASE DEL LAYOUT                   -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Codificación para caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Responsive para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título del proyecto -->
    <title>Editor Eléctrico AEA / ERSeP</title>

    <!-- Bootstrap (solo layout base) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio del editor -->
    <link rel="stylesheet" href="css/base.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- CONTENEDOR PRINCIPAL                                 -->
    <!-- ===================================================== -->

    <div id="app" class="editor-app">

        <!-- ================================================= -->
        <!-- BARRA SUPERIOR                                   -->
        <!-- ================================================= -->

        <header class="editor-header">

            <!-- Nombre del sistema -->
            <div class="editor-title">
                Editor Eléctrico AEA / ERSeP
            </div>

            <!-- Botón de cambio de tema -->
            <button id="btnTema" class="btn btn-sm btn-dark">
                Tema
            </button>

        </header>

        <!-- ================================================= -->
        <!-- CUERPO PRINCIPAL (3 COLUMNAS)                    -->
        <!-- ================================================= -->

        <div class="editor-body">

            <!-- ================================================= -->
            <!-- PANEL IZQUIERDO (HERRAMIENTAS)                  -->
            <!-- ================================================= -->

            <aside id="panelLeft" class="panel panel-left">

                <!-- Título del panel -->
                <h5>Herramientas</h5>

                <div id="tools">

                    <div class="container">
                        <button class="btn btn-sm btn-dark w-100 mb-1" id="toolSelect">
                            Seleccionar
                        </button>

                        <button class="btn btn-sm btn-dark w-100 mb-1" id="toolDelete">
                            Borrar Boca o Cable
                        </button>
                    </div>

                    <div class="container">

                        <button class="btn btn-sm btn-dark w-100 mb-1" id="toolCable">
                            Cable
                        </button>

                        <button class="btn btn-sm btn-warning w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Boca de iluminación" id="toolBoca">
                            <img src="assets/svg/Boca de Iluminacion.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Boca de iluminación de pared" id="toolBocaPared">
                            <img src="assets/svg/Boca Ilumincacion Pared.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-primary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Tomacorriente" id="toolToma">
                            <img src="assets/svg/Tomacorriente.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Tablero principal (TPA)" id="toolTPA">
                            <img src="assets/svg/Tablero Principal TPA TP.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Tablero seccional (TS/TPU)" id="toolTS">
                            <img src="assets/svg/Tablero Seccional TPU TS.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Interruptor 1 efecto" id="toolSwitch1">
                            <img src="assets/svg/Interruptor un efecto.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Interruptor 2 efectos" id="toolSwitch2">
                            <img src="assets/svg/Interruptor dos efectos.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Interruptor combinación" id="toolSwitchCombo">
                            <img src="assets/svg/Interruptor de combinacion.svg" width="44">
                        </button>

                        <button class="btn btn-sm btn-secondary w-100 mb-1" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Ventilador de techo" id="toolFan">
                            <img src="assets/svg/Ventilador de techo.svg" width="44">
                        </button>

                    </div>

                </div>

                <button id="btnCargarPlano" class="btn btn-sm btn-light w-100 mt-2">
                    Cargar plano
                </button>

                <input type="file" id="inputPlano" accept="image/*" hidden>

            </aside>

            <!-- ================================================= -->
            <!-- AREA CENTRAL (CANVAS DEL PLANO)                  -->
            <!-- ================================================= -->

            <main id="canvasWrapper" class="canvas-wrapper">
                <canvas id="canvasPlano"></canvas>
            </main>

            <!-- ================================================= -->
            <!-- PANEL DERECHO (PROPIEDADES)                     -->
            <!-- ================================================= -->

            <aside id="panelRight" class="panel panel-right">

                <h5>Propiedades</h5>

                <div id="properties">
                    <p class="text-muted">Selecciona un objeto</p>
                </div>

            </aside>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ===================================================== -->
    <!-- FABRIC.JS (OBLIGATORIO)                              -->
    <!-- ===================================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

    <!-- ===================================================== -->
    <!-- APP                                                  -->
    <!-- ===================================================== -->

    <script src="js/simbolos.js"></script>


    <script src="js/app.js"></script>

</body>

</html>
